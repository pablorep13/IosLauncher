version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Авто-обновление кода лаунчера и манифеста
          command: |
            # 1. Находим MainActivity.kt и сохраняем оригинальный package
            MAIN_FILE=$(find app/src/main/java -name "MainActivity.kt" | head -n 1)
            if [ -z "$MAIN_FILE" ]; then
              echo "MainActivity.kt не найден!"
              exit 1
            fi
            PKG_LINE=$(grep "^package " "$MAIN_FILE" | head -n 1)
            echo "Найден файл: $MAIN_FILE ($PKG_LINE)"

            # 2. Добавляем права на удаление приложений в AndroidManifest.xml (если их ещё нет)
            MANIFEST_FILE="app/src/main/AndroidManifest.xml"
            if ! grep -q "REQUEST_DELETE_PACKAGES" "$MANIFEST_FILE"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" \/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" \/>\n    <application/' "$MANIFEST_FILE"
            fi

            # 3. Записываем обновлённый MainActivity.kt
            echo "$PKG_LINE" > "$MAIN_FILE"
            cat << 'EOF' >> "$MAIN_FILE"

            import android.app.Activity
            import android.app.AlertDialog
            import android.content.Context
            import android.content.Intent
            import android.content.SharedPreferences
            import android.graphics.*
            import android.graphics.drawable.ColorDrawable
            import android.graphics.drawable.Drawable
            import android.graphics.drawable.GradientDrawable
            import android.graphics.drawable.LayerDrawable
            import android.net.Uri
            import android.os.BatteryManager
            import android.os.Bundle
            import android.os.Handler
            import android.os.Looper
            import android.provider.AlarmClock
            import android.provider.Settings
            import android.text.TextUtils
            import android.util.TypedValue
            import android.view.*
            import android.widget.*
            import org.json.JSONArray
            import org.json.JSONObject
            import java.text.SimpleDateFormat
            import java.util.*
            import kotlin.math.abs
            import kotlin.math.ceil
            import kotlin.math.min

            class MainActivity : Activity() {

                data class AppInfo(val label: String, val packageName: String, val icon: Drawable)

                sealed class HomeItem {
                    data class App(val appInfo: AppInfo) : HomeItem()
                    data class Folder(var name: String, val apps: MutableList<AppInfo>) : HomeItem()
                }

                enum class WidgetType { CLOCK, BATTERY, NOTE }

                // Кастомный контейнер, который перехватывает горизонтальный свайп даже поверх иконок
                inner class SwipePagerLayout(context: Context) : FrameLayout(context) {
                    private var startX = 0f
                    private var startY = 0f
                    private var isSwiping = false
                    var onSwipeLeft: (() -> Unit)? = null
                    var onSwipeRight: (() -> Unit)? = null

                    override fun onInterceptTouchEvent(ev: MotionEvent): Boolean {
                        when (ev.actionMasked) {
                            MotionEvent.ACTION_DOWN -> {
                                startX = ev.x
                                startY = ev.y
                                isSwiping = false
                            }
                            MotionEvent.ACTION_MOVE -> {
                                val dx = ev.x - startX
                                val dy = ev.y - startY
                                if (abs(dx) > dp(22) && abs(dx) > abs(dy) * 1.2f) {
                                    isSwiping = true
                                    return true // Перехватываем тач у иконки и начинаем свайп страницы
                                }
                            }
                        }
                        return super.onInterceptTouchEvent(ev)
                    }

                    override fun onTouchEvent(ev: MotionEvent): Boolean {
                        if (ev.actionMasked == MotionEvent.ACTION_UP || ev.actionMasked == MotionEvent.ACTION_CANCEL) {
                            val dx = ev.x - startX
                            if (abs(dx) > dp(45)) {
                                if (dx < 0) onSwipeLeft?.invoke() else onSwipeRight?.invoke()
                            }
                            isSwiping = false
                            return true
                        }
                        return true
                    }
                }

                private lateinit var prefs: SharedPreferences
                private val allApps = mutableListOf<AppInfo>()
                private val homeItems = mutableListOf<HomeItem>()
                private val activeWidgets = mutableListOf<WidgetType>()

                private var isHorizontalMode = true
                private var currentPage = 0
                private val columns = 4
                private val itemsPerPage = 16

                private lateinit var rootLayout: FrameLayout
                private lateinit var mainColumn: LinearLayout
                private lateinit var widgetsContainer: LinearLayout
                private lateinit var appsContainer: FrameLayout
                private lateinit var pageIndicatorLayout: LinearLayout
                private lateinit var dockLayout: LinearLayout

                private val clockHandler = Handler(Looper.getMainLooper())
                private val clockRunnable = object : Runnable {
                    override fun run() {
                        updateWidgetsUI()
                        clockHandler.postDelayed(this, 10000)
                    }
                }

                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WALLPAPER)
                    window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)
                    window.statusBarColor = Color.TRANSPARENT
                    window.navigationBarColor = Color.TRANSPARENT

                    prefs = getSharedPreferences("ios_launcher_prefs", Context.MODE_PRIVATE)
                    isHorizontalMode = prefs.getBoolean("horizontal_mode", true)

                    loadActiveWidgets()
                    loadInstalledApps()
                    buildHomeItemsFromState()
                    setupUI()
                }

                override fun onResume() {
                    super.onResume()
                    clockHandler.post(clockRunnable)
                    val oldCount = allApps.size
                    loadInstalledApps()
                    if (allApps.size != oldCount) {
                        buildHomeItemsFromState()
                        renderAppsArea()
                        renderDock()
                    }
                }

                override fun onPause() {
                    super.onPause()
                    clockHandler.removeCallbacks(clockRunnable)
                }

                override fun onBackPressed() {}

                private fun loadInstalledApps() {
                    allApps.clear()
                    val pm = packageManager
                    val intent = Intent(Intent.ACTION_MAIN, null).apply {
                        addCategory(Intent.CATEGORY_LAUNCHER)
                    }
                    val list = pm.queryIntentActivities(intent, 0)
                    for (ri in list) {
                        val pkg = ri.activityInfo.packageName
                        if (pkg == packageName) continue
                        allApps.add(AppInfo(ri.loadLabel(pm).toString(), pkg, ri.loadIcon(pm)))
                    }
                    allApps.sortBy { it.label.lowercase(Locale.getDefault()) }
                }

                private fun loadActiveWidgets() {
                    activeWidgets.clear()
                    val saved = prefs.getString("active_widgets", "CLOCK") ?: "CLOCK"
                    if (saved.isNotEmpty()) {
                        saved.split(",").forEach {
                            runCatching { activeWidgets.add(WidgetType.valueOf(it)) }
                        }
                    }
                }

                private fun saveActiveWidgets() {
                    prefs.edit().putString("active_widgets", activeWidgets.joinToString(",") { it.name }).apply()
                }

                private fun buildHomeItemsFromState() {
                    homeItems.clear()
                    val map = allApps.associateBy { it.packageName }.toMutableMap()

                    val foldersJson = prefs.getString("folders_json", "[]") ?: "[]"
                    runCatching {
                        val arr = JSONArray(foldersJson)
                        for (i in 0 until arr.length()) {
                            val obj = arr.getJSONObject(i)
                            val name = obj.getString("name")
                            val pkgs = obj.getJSONArray("apps")
                            val list = mutableListOf<AppInfo>()
                            for (j in 0 until pkgs.length()) {
                                map.remove(pkgs.getString(j))?.let { list.add(it) }
                            }
                            if (list.isNotEmpty()) homeItems.add(HomeItem.Folder(name, list))
                        }
                    }

                    val order = prefs.getString("apps_order", "") ?: ""
                    if (order.isNotEmpty()) {
                        order.split(",").forEach { pkg ->
                            map.remove(pkg)?.let { homeItems.add(HomeItem.App(it)) }
                        }
                    }
                    map.values.forEach { homeItems.add(HomeItem.App(it)) }
                }

                private fun saveHomeState() {
                    val foldersArr = JSONArray()
                    val orderList = mutableListOf<String>()
                    for (item in homeItems) {
                        when (item) {
                            is HomeItem.Folder -> {
                                if (item.apps.isNotEmpty()) {
                                    val obj = JSONObject()
                                    obj.put("name", item.name)
                                    val pkgs = JSONArray()
                                    item.apps.forEach { pkgs.put(it.packageName) }
                                    obj.put("apps", pkgs)
                                    foldersArr.put(obj)
                                }
                            }
                            is HomeItem.App -> orderList.add(item.appInfo.packageName)
                        }
                    }
                    prefs.edit()
                        .putString("folders_json", foldersArr.toString())
                        .putString("apps_order", orderList.joinToString(","))
                        .apply()
                }

                private fun setupUI() {
                    rootLayout = FrameLayout(this).apply {
                        setBackgroundColor(Color.TRANSPARENT)
                        setOnLongClickListener {
                            showLauncherSettingsDialog()
                            true
                        }
                    }

                    mainColumn = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        setPadding(dp(12), dp(44), dp(12), dp(24))
                    }

                    widgetsContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                    mainColumn.addView(widgetsContainer, LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                    ))

                    appsContainer = FrameLayout(this)
                    mainColumn.addView(appsContainer, LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                    ).apply {
                        topMargin = dp(8)
                        bottomMargin = dp(4)
                    })

                    pageIndicatorLayout = LinearLayout(this).apply {
                        orientation = LinearLayout.HORIZONTAL
                        gravity = Gravity.CENTER
                    }
                    mainColumn.addView(pageIndicatorLayout, LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, dp(18)
                    ))

                    val searchBar = createSearchBar()
                    mainColumn.addView(searchBar, LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, dp(44)
                    ).apply {
                        topMargin = dp(6)
                        bottomMargin = dp(10)
                        leftMargin = dp(8)
                        rightMargin = dp(8)
                    })

                    dockLayout = LinearLayout(this).apply {
                        orientation = LinearLayout.HORIZONTAL
                        gravity = Gravity.CENTER
                        background = createLiquidGlassDrawable(28f)
                        setPadding(dp(10), dp(10), dp(10), dp(10))
                    }
                    mainColumn.addView(dockLayout, LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, dp(88)
                    ))

                    rootLayout.addView(mainColumn, FrameLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                    ))
                    setContentView(rootLayout)

                    updateWidgetsUI()
                    renderAppsArea()
                    renderDock()
                }

                private fun updateWidgetsUI() {
                    widgetsContainer.removeAllViews()
                    for ((index, type) in activeWidgets.withIndex()) {
                        val v = when (type) {
                            WidgetType.CLOCK -> buildClockWidget()
                            WidgetType.BATTERY -> buildBatteryWidget()
                            WidgetType.NOTE -> buildNoteWidget()
                        }
                        v.setOnLongClickListener {
                            showWidgetMenu(index)
                            true
                        }
                        widgetsContainer.addView(v, LinearLayout.LayoutParams(
                            ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                        ).apply { bottomMargin = dp(8) })
                    }
                }

                private fun buildClockWidget(): View {
                    val box = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        background = createLiquidGlassDrawable(26f)
                        setPadding(dp(22), dp(14), dp(22), dp(16))
                        setOnClickListener {
                            runCatching {
                                startActivity(Intent(AlarmClock.ACTION_SHOW_ALARMS).apply {
                                    flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                })
                            }.onFailure {
                                showWidgetMenu(0)
                            }
                        }
                    }
                    val now = Date()
                    val timeTv = TextView(this).apply {
                        text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(now)
                        setTextColor(Color.WHITE)
                        setTextSize(TypedValue.COMPLEX_UNIT_SP, 50f)
                        typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                        setShadowLayer(8f, 0f, 2f, Color.argb(90, 0, 0, 0))
                    }
                    val dateTv = TextView(this).apply {
                        text = SimpleDateFormat("EEEE, d MMMM", Locale("ru")).format(now)
                        setTextColor(Color.argb(235, 255, 255, 255))
                        setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                        setShadowLayer(6f, 0f, 1f, Color.argb(90, 0, 0, 0))
                    }
                    box.addView(timeTv)
                    box.addView(dateTv)
                    return box
                }

                private fun buildBatteryWidget(): View {
                    val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                    val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                    return LinearLayout(this).apply {
                        background = createLiquidGlassDrawable(22f)
                        setPadding(dp(20), dp(14), dp(20), dp(14))
                        setOnClickListener {
                            runCatching { startActivity(Intent(Intent.ACTION_POWER_USAGE_SUMMARY)) }
                        }
                        addView(TextView(this@MainActivity).apply {
                            text = "🔋 Заряд батареи: $level%"
                            setTextColor(Color.WHITE)
                            setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                            typeface = Typeface.DEFAULT_BOLD
                        })
                    }
                }

                private fun buildNoteWidget(): View {
                    val note = prefs.getString("widget_note", "Нажмите для редактирования заметки")
                    return LinearLayout(this).apply {
                        background = createLiquidGlassDrawable(22f)
                        setPadding(dp(20), dp(14), dp(20), dp(14))
                        setOnClickListener { editNoteDialog() }
                        addView(TextView(this@MainActivity).apply {
                            text = "📌 $note"
                            setTextColor(Color.WHITE)
                            setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                        })
                    }
                }

                private fun showWidgetMenu(index: Int) {
                    val items = arrayOf(
                        "➕ Добавить виджет",
                        "⬆️ Переместить выше",
                        "⬇️ Переместить ниже",
                        "🗑️ Удалить этот виджет"
                    )
                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle("Виджет")
                        .setItems(items) { _, w ->
                            when (w) {
                                0 -> showAddWidgetDialog()
                                1 -> if (index > 0) {
                                    Collections.swap(activeWidgets, index, index - 1)
                                    saveActiveWidgets()
                                    updateWidgetsUI()
                                }
                                2 -> if (index < activeWidgets.size - 1) {
                                    Collections.swap(activeWidgets, index, index + 1)
                                    saveActiveWidgets()
                                    updateWidgetsUI()
                                }
                                3 -> {
                                    activeWidgets.removeAt(index)
                                    saveActiveWidgets()
                                    updateWidgetsUI()
                                }
                            }
                        }.show()
                }

                private fun showAddWidgetDialog() {
                    val names = arrayOf("🕒 Часы (Liquid Glass)", "🔋 Заряд батареи", "📌 Заметка")
                    val types = arrayOf(WidgetType.CLOCK, WidgetType.BATTERY, WidgetType.NOTE)
                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle("Добавить виджет")
                        .setItems(names) { _, w ->
                            if (!activeWidgets.contains(types[w])) {
                                activeWidgets.add(types[w])
                                saveActiveWidgets()
                                updateWidgetsUI()
                            }
                        }.show()
                }

                private fun editNoteDialog() {
                    val input = EditText(this).apply {
                        setText(prefs.getString("widget_note", ""))
                        setTextColor(Color.WHITE)
                    }
                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle("Текст заметки")
                        .setView(input)
                        .setPositiveButton("Сохранить") { _, _ ->
                            prefs.edit().putString("widget_note", input.text.toString()).apply()
                            updateWidgetsUI()
                        }
                        .setNegativeButton("Отмена", null)
                        .show()
                }

                private fun renderAppsArea() {
                    appsContainer.removeAllViews()
                    pageIndicatorLayout.removeAllViews()

                    if (isHorizontalMode) {
                        pageIndicatorLayout.visibility = View.VISIBLE
                        val totalPages = maxOf(1, ceil(homeItems.size.toDouble() / itemsPerPage).toInt())
                        if (currentPage >= totalPages) currentPage = totalPages - 1

                        val start = currentPage * itemsPerPage
                        val end = min(start + itemsPerPage, homeItems.size)
                        val slice = if (start < homeItems.size) homeItems.subList(start, end) else emptyList()

                        val swipeLayout = SwipePagerLayout(this).apply {
                            onSwipeLeft = {
                                if (currentPage < totalPages - 1) {
                                    currentPage++
                                    renderAppsArea()
                                }
                            }
                            onSwipeRight = {
                                if (currentPage > 0) {
                                    currentPage--
                                    renderAppsArea()
                                }
                            }
                        }

                        swipeLayout.addView(buildGridForItems(slice, start), FrameLayout.LayoutParams(
                            ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                        ))
                        appsContainer.addView(swipeLayout)

                        for (i in 0 until totalPages) {
                            val dot = View(this).apply {
                                val sz = if (i == currentPage) dp(8) else dp(6)
                                layoutParams = LinearLayout.LayoutParams(sz, sz).apply {
                                    leftMargin = dp(4)
                                    rightMargin = dp(4)
                                }
                                background = GradientDrawable().apply {
                                    shape = GradientDrawable.OVAL
                                    setColor(if (i == currentPage) Color.WHITE else Color.argb(110, 255, 255, 255))
                                }
                            }
                            pageIndicatorLayout.addView(dot)
                        }
                    } else {
                        pageIndicatorLayout.visibility = View.GONE
                        val scroll = ScrollView(this).apply { isVerticalScrollBarEnabled = false }
                        scroll.addView(buildGridForItems(homeItems, 0))
                        appsContainer.addView(scroll, FrameLayout.LayoutParams(
                            ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                        ))
                    }
                }

                private fun buildGridForItems(items: List<HomeItem>, offset: Int): LinearLayout {
                    return LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        val rows = ceil(items.size.toDouble() / columns).toInt()
                        for (r in 0 until rows) {
                            val row = LinearLayout(this@MainActivity).apply {
                                orientation = LinearLayout.HORIZONTAL
                                weightSum = columns.toFloat()
                            }
                            for (c in 0 until columns) {
                                val idx = r * columns + c
                                if (idx < items.size) {
                                    row.addView(
                                        createHomeItemView(items[idx], offset + idx),
                                        LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                                            topMargin = dp(8)
                                            bottomMargin = dp(8)
                                        }
                                    )
                                } else {
                                    row.addView(Space(this@MainActivity), LinearLayout.LayoutParams(0, dp(10), 1f))
                                }
                            }
                            addView(row)
                        }
                    }
                }

                private fun createHomeItemView(item: HomeItem, globalIdx: Int): View {
                    val box = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        gravity = Gravity.CENTER_HORIZONTAL
                        setPadding(dp(4), dp(4), dp(4), dp(4))
                    }

                    when (item) {
                        is HomeItem.App -> {
                            val iv = ImageView(this).apply {
                                setImageDrawable(item.appInfo.icon)
                                scaleType = ImageView.ScaleType.FIT_CENTER
                            }
                            val tv = TextView(this).apply {
                                text = item.appInfo.label
                                setTextColor(Color.WHITE)
                                setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                                maxLines = 1
                                ellipsize = TextUtils.TruncateAt.END
                                gravity = Gravity.CENTER
                                setShadowLayer(5f, 0f, 1f, Color.BLACK)
                            }
                            box.addView(iv, LinearLayout.LayoutParams(dp(58), dp(58)))
                            box.addView(tv, LinearLayout.LayoutParams(
                                ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                            ).apply { topMargin = dp(4) })

                            box.setOnClickListener { launchApp(item.appInfo.packageName) }
                            box.setOnLongClickListener {
                                showAppPopup(box, item.appInfo, globalIdx)
                                true
                            }
                        }

                        is HomeItem.Folder -> {
                            val grid = GridLayout(this).apply {
                                rowCount = 2
                                columnCount = 2
                                background = createLiquidGlassDrawable(16f)
                                setPadding(dp(6), dp(6), dp(6), dp(6))
                            }
                            item.apps.take(4).forEach { app ->
                                grid.addView(ImageView(this).apply {
                                    setImageDrawable(app.icon)
                                    layoutParams = GridLayout.LayoutParams().apply {
                                        width = dp(20)
                                        height = dp(20)
                                        setMargins(dp(2), dp(2), dp(2), dp(2))
                                    }
                                })
                            }
                            val tv = TextView(this).apply {
                                text = item.name
                                setTextColor(Color.WHITE)
                                setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                                maxLines = 1
                                ellipsize = TextUtils.TruncateAt.END
                                gravity = Gravity.CENTER
                                setShadowLayer(5f, 0f, 1f, Color.BLACK)
                            }
                            box.addView(grid, LinearLayout.LayoutParams(dp(58), dp(58)))
                            box.addView(tv, LinearLayout.LayoutParams(
                                ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                            ).apply { topMargin = dp(4) })

                            box.setOnClickListener { openFolderDialog(item) }
                            box.setOnLongClickListener {
                                showFolderMenu(item, globalIdx)
                                true
                            }
                        }
                    }
                    return box
                }

                private fun showAppPopup(anchor: View, app: AppInfo, index: Int) {
                    val layout = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        background = GradientDrawable().apply {
                            cornerRadius = dp(18).toFloat()
                            setColor(Color.argb(235, 36, 36, 40))
                            setStroke(dp(1), Color.argb(110, 255, 255, 255))
                        }
                        setPadding(dp(6), dp(6), dp(6), dp(6))
                    }
                    lateinit var popup: PopupWindow

                    fun row(text: String, color: Int = Color.WHITE, action: () -> Unit) {
                        layout.addView(TextView(this).apply {
                            this.text = text
                            setTextColor(color)
                            setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                            setPadding(dp(16), dp(11), dp(16), dp(11))
                            setOnClickListener {
                                popup.dismiss()
                                action()
                            }
                        })
                    }

                    row("ℹ️  О приложении") { openAppSettings(app.packageName) }
                    row("🗑️  Удалить приложение", Color.rgb(255, 95, 87)) { uninstallApp(app.packageName) }
                    row("📁  В папку / Создать папку") { moveToFolderDialog(app, index) }
                    row("⬅️  Сдвинуть влево") {
                        if (index > 0) {
                            Collections.swap(homeItems, index, index - 1)
                            saveHomeState()
                            renderAppsArea()
                        }
                    }
                    row("➡️  Сдвинуть вправо") {
                        if (index < homeItems.size - 1) {
                            Collections.swap(homeItems, index, index + 1)
                            saveHomeState()
                            renderAppsArea()
                        }
                    }

                    popup = PopupWindow(layout, dp(240), ViewGroup.LayoutParams.WRAP_CONTENT, true).apply {
                        elevation = 24f
                        setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                        showAsDropDown(anchor, 0, -dp(20))
                    }
                }

                private fun moveToFolderDialog(app: AppInfo, index: Int) {
                    val folders = homeItems.filterIsInstance<HomeItem.Folder>()
                    val opts = mutableListOf("➕ Создать новую папку")
                    folders.forEach { opts.add("📁 ${it.name}") }

                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle(app.label)
                        .setItems(opts.toTypedArray()) { _, w ->
                            if (w == 0) {
                                val input = EditText(this).apply {
                                    setText("Новая папка")
                                    setTextColor(Color.WHITE)
                                }
                                AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                                    .setTitle("Название папки")
                                    .setView(input)
                                    .setPositiveButton("Создать") { _, _ ->
                                        val name = input.text.toString().ifBlank { "Папка" }
                                        homeItems[index] = HomeItem.Folder(name, mutableListOf(app))
                                        saveHomeState()
                                        renderAppsArea()
                                    }
                                    .setNegativeButton("Отмена", null)
                                    .show()
                            } else {
                                folders[w - 1].apps.add(app)
                                homeItems.removeAt(index)
                                saveHomeState()
                                renderAppsArea()
                            }
                        }.show()
                }

                private fun openFolderDialog(folder: HomeItem.Folder) {
                    val box = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        setPadding(dp(20), dp(20), dp(20), dp(20))
                        background = createLiquidGlassDrawable(28f)
                    }
                    box.addView(TextView(this).apply {
                        text = folder.name
                        setTextColor(Color.WHITE)
                        setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
                        typeface = Typeface.DEFAULT_BOLD
                        gravity = Gravity.CENTER
                        setPadding(0, 0, 0, dp(12))
                    })

                    val grid = GridLayout(this).apply { columnCount = 3 }
                    lateinit var dialog: AlertDialog

                    folder.apps.toList().forEachIndexed { idx, app ->
                        val cell = LinearLayout(this).apply {
                            orientation = LinearLayout.VERTICAL
                            gravity = Gravity.CENTER
                            setPadding(dp(10), dp(10), dp(10), dp(10))
                            setOnClickListener {
                                dialog.dismiss()
                                launchApp(app.packageName)
                            }
                            setOnLongClickListener {
                                dialog.dismiss()
                                folder.apps.removeAt(idx)
                                homeItems.add(HomeItem.App(app))
                                if (folder.apps.isEmpty()) homeItems.remove(folder)
                                saveHomeState()
                                renderAppsArea()
                                Toast.makeText(this@MainActivity, "Вынесено на главный экран", Toast.LENGTH_SHORT).show()
                                true
                            }
                        }
                        cell.addView(ImageView(this).apply {
                            setImageDrawable(app.icon)
                            layoutParams = LinearLayout.LayoutParams(dp(50), dp(50))
                        })
                        cell.addView(TextView(this).apply {
                            text = app.label
                            setTextColor(Color.WHITE)
                            setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                            maxLines = 1
                        })
                        grid.addView(cell)
                    }
                    box.addView(grid)

                    dialog = AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setView(box)
                        .setPositiveButton("Закрыть", null)
                        .create()
                    dialog.window?.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                    dialog.show()
                }

                private fun showFolderMenu(folder: HomeItem.Folder, index: Int) {
                    val opts = arrayOf("✏️ Переименовать", "📂 Расформировать папку")
                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle(folder.name)
                        .setItems(opts) { _, w ->
                            if (w == 0) {
                                val input = EditText(this).apply {
                                    setText(folder.name)
                                    setTextColor(Color.WHITE)
                                }
                                AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                                    .setTitle("Переименовать")
                                    .setView(input)
                                    .setPositiveButton("ОК") { _, _ ->
                                        folder.name = input.text.toString().ifBlank { "Папка" }
                                        saveHomeState()
                                        renderAppsArea()
                                    }.show()
                            } else {
                                homeItems.removeAt(index)
                                folder.apps.forEach { homeItems.add(HomeItem.App(it)) }
                                saveHomeState()
                                renderAppsArea()
                            }
                        }.show()
                }

                private fun createSearchBar(): LinearLayout {
                    return LinearLayout(this).apply {
                        orientation = LinearLayout.HORIZONTAL
                        gravity = Gravity.CENTER_VERTICAL
                        background = createLiquidGlassDrawable(22f)
                        setPadding(dp(18), dp(6), dp(14), dp(6))

                        addView(TextView(this@MainActivity).apply {
                            text = "🔍  Поиск"
                            setTextColor(Color.WHITE)
                            setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                            layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                            setOnClickListener { showSearchDialog() }
                        })

                        addView(TextView(this@MainActivity).apply {
                            text = "⚙️"
                            setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                            setPadding(dp(8), dp(2), dp(4), dp(2))
                            setOnClickListener { showLauncherSettingsDialog() }
                        })
                    }
                }

                private fun showSearchDialog() {
                    val box = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        setPadding(dp(16), dp(16), dp(16), dp(16))
                    }
                    val input = EditText(this).apply { hint = "Поиск приложений..." }
                    val lv = ListView(this)
                    box.addView(input)
                    box.addView(lv)

                    val dlg = AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle("Поиск")
                        .setView(box)
                        .setNegativeButton("Закрыть", null)
                        .create()

                    fun filter(q: String) {
                        val list = allApps.filter { it.label.contains(q, true) }
                        lv.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, list.map { it.label })
                        lv.setOnItemClickListener { _, _, pos, _ ->
                            dlg.dismiss()
                            launchApp(list[pos].packageName)
                        }
                    }

                    input.addTextChangedListener(object : android.text.TextWatcher {
                        override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                        override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                            filter(s?.toString() ?: "")
                        }
                        override fun afterTextChanged(s: android.text.Editable?) {}
                    })
                    filter("")
                    dlg.show()
                }

                private fun showLauncherSettingsDialog() {
                    val mode = if (isHorizontalMode) "Влево-вправо (страницы iOS)" else "Сверху-вниз (вертикально)"
                    val opts = arrayOf(
                        "🔄 Прокрутка экрана: $mode",
                        "➕ Добавить виджет",
                        "♻️ Сбросить сетку по умолчанию"
                    )
                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle("Настройки лаунчера")
                        .setItems(opts) { _, w ->
                            when (w) {
                                0 -> {
                                    isHorizontalMode = !isHorizontalMode
                                    prefs.edit().putBoolean("horizontal_mode", isHorizontalMode).apply()
                                    currentPage = 0
                                    renderAppsArea()
                                }
                                1 -> showAddWidgetDialog()
                                2 -> {
                                    prefs.edit().remove("folders_json").remove("apps_order").apply()
                                    buildHomeItemsFromState()
                                    renderAppsArea()
                                }
                            }
                        }.show()
                }

                private fun renderDock() {
                    dockLayout.removeAllViews()
                    allApps.take(4).forEach { app ->
                        dockLayout.addView(ImageView(this).apply {
                            setImageDrawable(app.icon)
                            layoutParams = LinearLayout.LayoutParams(0, dp(60), 1f)
                            scaleType = ImageView.ScaleType.FIT_CENTER
                            setOnClickListener { launchApp(app.packageName) }
                            setOnLongClickListener {
                                showAppPopup(this, app, 0)
                                true
                            }
                        })
                    }
                }

                private fun launchApp(pkg: String) {
                    packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
                }

                private fun uninstallApp(pkg: String) {
                    startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:$pkg")).apply {
                        flags = Intent.FLAG_ACTIVITY_NEW_TASK
                    })
                }

                private fun openAppSettings(pkg: String) {
                    startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")).apply {
                        flags = Intent.FLAG_ACTIVITY_NEW_TASK
                    })
                }

                // Эффект выпуклого стекла с бликом по краям
                private fun createLiquidGlassDrawable(radiusDp: Float): Drawable {
                    val r = dp(radiusDp.toInt()).toFloat()
                    val base = GradientDrawable(
                        GradientDrawable.Orientation.TL_BR,
                        intArrayOf(
                            Color.argb(95, 255, 255, 255),
                            Color.argb(45, 255, 255, 255),
                            Color.argb(80, 255, 255, 255)
                        )
                    ).apply {
                        cornerRadius = r
                        setStroke(dp(1), Color.argb(170, 255, 255, 255))
                    }
                    return base
                }

                private fun dp(v: Int): Int =
                    TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
            }
            EOF

      - run:
          name: Сборка Debug APK
          command: |
            chmod +x ./gradlew
            ./gradlew assembleDebug

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk
