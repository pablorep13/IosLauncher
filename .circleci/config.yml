version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Установка Ninja, CMake и обновление кода
          command: |
            echo "========== STEP STARTED =========="
            
            sudo apt-get update
            sudo apt-get install -y ninja-build cmake
            
            echo "========== APT FINISHED =========="
            echo "========== STARTING PYTHON INJECTION =========="

            python3 -c '
import glob, os, re, sys

print("=" * 60)
print("=== PYTHON SCRIPT STARTED ===")
print("=" * 60)

# Ищем MainActivity
candidates = glob.glob("**/MainActivity.kt", recursive=True)
candidates += glob.glob("**/MainActivity.java", recursive=True)
candidates += glob.glob("**/*Activity.kt", recursive=True)

print("Candidates:")
for c in candidates:
    print("  ->", c)

main_file = None
for f in candidates:
    if "MainActivity" in os.path.basename(f):
        main_file = f
        break
if not main_file and candidates:
    main_file = candidates[0]

if not main_file:
    print("ERROR: No MainActivity found!")
    for f in glob.glob("**/*.kt", recursive=True):
        print("  ", f)
    sys.exit(1)

print("=== USING:", main_file, "===")

pkg_line = "package com.example.ioslauncher"
try:
    with open(main_file, "r", encoding="utf-8") as f:
        for line in f:
            if line.strip().startswith("package "):
                pkg_line = line.strip()
                break
except Exception as e:
    print("Package read error:", e)

print("Package:", pkg_line)

# === Manifest ===
manifests = [m for m in glob.glob("**/AndroidManifest.xml", recursive=True) if "build/" not in m and "intermediates" not in m]
print("Manifests:", manifests)

for mf in manifests:
    print("Processing", mf)
    with open(mf, "r", encoding="utf-8") as f:
        content = f.read()
    original = content

    content = re.sub(r"<uses-permission[^>]*QUERY_ALL_PACKAGES[^/]*/>\s*", "", content)

    if "REQUEST_DELETE_PACKAGES" not in content:
        perms = """    <uses-permission android:name=\"android.permission.REQUEST_DELETE_PACKAGES\" />
    <uses-permission android:name=\"android.permission.VIBRATE\" />
    <uses-permission android:name=\"android.permission.SET_WALLPAPER\" />
"""
        content = content.replace("<application", perms + "\n    <application", 1)

    if "<queries>" not in content:
        queries = """
    <queries>
        <intent>
            <action android:name=\"android.intent.action.MAIN\" />
            <category android:name=\"android.intent.category.LAUNCHER\" />
        </intent>
    </queries>
"""
        content = content.replace("<application", queries + "\n    <application", 1)

    if "xmlns:tools=" not in content:
        content = content.replace(
            "xmlns:android=\"http://schemas.android.com/apk/res/android\"",
            "xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\""
        )

    if "android.intent.category.HOME" not in content:
        home_filter = """
            <intent-filter>
                <action android:name=\"android.intent.action.MAIN\" />
                <category android:name=\"android.intent.category.HOME\" />
                <category android:name=\"android.intent.category.DEFAULT\" />
                <category android:name=\"android.intent.category.LAUNCHER\" />
            </intent-filter>
"""
        content = content.replace("</activity>", home_filter + "        </activity>", 1)

    content = re.sub(
        r"(<activity[^>]*android:name=\"[^\"]*MainActivity\"[^>]*)(>)",
        r"\1 android:exported=\"true\" android:launchMode=\"singleTask\" android:stateNotNeeded=\"true\" android:clearTaskOnLaunch=\"true\"\2",
        content, count=1
    )

    if content != original:
        with open(mf, "w", encoding="utf-8") as f:
            f.write(content)
        print("=== MANIFEST UPDATED:", mf, "===")
    else:
        print("Manifest already OK:", mf)

# === Kotlin code ===
kotlin_code = r"""
import android.animation.*
import android.app.Activity
import android.app.AlertDialog
import android.content.Context
import android.content.Intent
import android.content.SharedPreferences
import android.graphics.*
import android.graphics.drawable.ColorDrawable
import android.graphics.drawable.Drawable
import android.graphics.drawable.GradientDrawable
import android.graphics.drawable.LayerDrawable
import android.net.Uri
import android.os.BatteryManager
import android.os.Build
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import android.os.VibrationEffect
import android.os.Vibrator
import android.os.VibratorManager
import android.provider.AlarmClock
import android.provider.Settings
import android.text.Editable
import android.text.TextUtils
import android.text.TextWatcher
import android.util.TypedValue
import android.view.*
import android.view.animation.DecelerateInterpolator
import android.view.animation.OvershootInterpolator
import android.widget.*
import org.json.JSONArray
import org.json.JSONObject
import java.text.SimpleDateFormat
import java.util.*
import kotlin.math.abs
import kotlin.math.ceil
import kotlin.math.min

class MainActivity : Activity() {

    data class AppInfo(val label: String, val packageName: String, val icon: Drawable)

    sealed class HomeItem {
        data class App(val appInfo: AppInfo) : HomeItem()
        data class Folder(var name: String, val apps: MutableList<AppInfo>) : HomeItem()
    }

    enum class WidgetType { CLOCK, BATTERY, NOTE }

    inner class SwipePagerLayout(context: Context) : FrameLayout(context) {
        private var startX = 0f
        private var startY = 0f
        var onSwipeLeft: (() -> Unit)? = null
        var onSwipeRight: (() -> Unit)? = null
        private var isSwiping = false

        override fun onInterceptTouchEvent(ev: MotionEvent): Boolean {
            when (ev.actionMasked) {
                MotionEvent.ACTION_DOWN -> { startX = ev.x; startY = ev.y; isSwiping = false }
                MotionEvent.ACTION_MOVE -> {
                    val dx = ev.x - startX
                    val dy = ev.y - startY
                    if (abs(dx) > dp(18) && abs(dx) > abs(dy) * 1.3f) {
                        isSwiping = true
                        return true
                    }
                }
            }
            return super.onInterceptTouchEvent(ev)
        }

        override fun onTouchEvent(ev: MotionEvent): Boolean {
            if (ev.actionMasked == MotionEvent.ACTION_UP || ev.actionMasked == MotionEvent.ACTION_CANCEL) {
                if (isSwiping) {
                    val dx = ev.x - startX
                    if (abs(dx) > dp(50)) {
                        performHaptic(30)
                        if (dx < 0) onSwipeLeft?.invoke() else onSwipeRight?.invoke()
                    }
                }
                isSwiping = false
                return true
            }
            return true
        }
    }

    private lateinit var prefs: SharedPreferences
    private val allApps = mutableListOf<AppInfo>()
    private val homeItems = mutableListOf<HomeItem>()
    private val activeWidgets = mutableListOf<WidgetType>()
    private var isHorizontalMode = true
    private var currentPage = 0
    private val columns = 4
    private val itemsPerPage = 16
    private var isEditMode = false

    private lateinit var rootLayout: FrameLayout
    private lateinit var mainColumn: LinearLayout
    private lateinit var widgetsContainer: LinearLayout
    private lateinit var appsContainer: FrameLayout
    private lateinit var pageIndicatorLayout: LinearLayout
    private lateinit var dockLayout: LinearLayout

    private val clockHandler = Handler(Looper.getMainLooper())
    private val clockRunnable = object : Runnable {
        override fun run() {
            updateWidgetsUI()
            clockHandler.postDelayed(this, 15000)
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WALLPAPER)
        window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)
        window.statusBarColor = Color.TRANSPARENT
        window.navigationBarColor = Color.TRANSPARENT
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) window.setDecorFitsSystemWindows(false)

        prefs = getSharedPreferences("ios_launcher_prefs_v3", Context.MODE_PRIVATE)
        isHorizontalMode = prefs.getBoolean("horizontal_mode", true)

        loadActiveWidgets()
        loadInstalledApps()
        buildHomeItemsFromState()
        setupUI()
    }

    override fun onResume() {
        super.onResume()
        clockHandler.post(clockRunnable)
        val old = allApps.size
        loadInstalledApps()
        if (allApps.size != old) {
            buildHomeItemsFromState()
            renderAppsArea()
            renderDock()
        }
    }

    override fun onPause() {
        super.onPause()
        clockHandler.removeCallbacks(clockRunnable)
        exitEditMode()
    }

    @Deprecated("Deprecated in Java")
    override fun onBackPressed() {
        if (isEditMode) exitEditMode()
    }

    private fun performHaptic(ms: Long = 25) {
        try {
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                val vm = getSystemService(VibratorManager::class.java)
                vm?.defaultVibrator?.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
            } else {
                @Suppress("DEPRECATION")
                val v = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    v?.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                } else {
                    @Suppress("DEPRECATION")
                    v?.vibrate(ms)
                }
            }
        } catch (_: Exception) {}
    }

    private fun loadInstalledApps() {
        allApps.clear()
        val pm = packageManager
        val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
        for (ri in pm.queryIntentActivities(intent, 0)) {
            val pkg = ri.activityInfo.packageName
            if (pkg == packageName) continue
            try {
                allApps.add(AppInfo(ri.loadLabel(pm).toString(), pkg, ri.loadIcon(pm)))
            } catch (_: Exception) {}
        }
        allApps.sortBy { it.label.lowercase(Locale.getDefault()) }
    }

    private fun loadActiveWidgets() {
        activeWidgets.clear()
        val saved = prefs.getString("active_widgets", "CLOCK") ?: "CLOCK"
        saved.split(",").forEach { runCatching { activeWidgets.add(WidgetType.valueOf(it.trim())) } }
        if (activeWidgets.isEmpty()) activeWidgets.add(WidgetType.CLOCK)
    }

    private fun saveActiveWidgets() {
        prefs.edit().putString("active_widgets", activeWidgets.joinToString(",") { it.name }).apply()
    }

    private fun buildHomeItemsFromState() {
        homeItems.clear()
        val map = allApps.associateBy { it.packageName }.toMutableMap()
        val foldersJson = prefs.getString("folders_json", "[]") ?: "[]"
        runCatching {
            val arr = JSONArray(foldersJson)
            for (i in 0 until arr.length()) {
                val obj = arr.getJSONObject(i)
                val name = obj.getString("name")
                val pkgs = obj.getJSONArray("apps")
                val list = mutableListOf<AppInfo>()
                for (j in 0 until pkgs.length()) map.remove(pkgs.getString(j))?.let { list.add(it) }
                if (list.isNotEmpty()) homeItems.add(HomeItem.Folder(name, list))
            }
        }
        val order = prefs.getString("apps_order", "") ?: ""
        if (order.isNotEmpty()) order.split(",").forEach { pkg -> map.remove(pkg)?.let { homeItems.add(HomeItem.App(it)) } }
        map.values.forEach { homeItems.add(HomeItem.App(it)) }
    }

    private fun saveHomeState() {
        val foldersArr = JSONArray()
        val orderList = mutableListOf<String>()
        for (item in homeItems) {
            when (item) {
                is HomeItem.Folder -> if (item.apps.isNotEmpty()) {
                    val obj = JSONObject()
                    obj.put("name", item.name)
                    val pkgs = JSONArray()
                    item.apps.forEach { pkgs.put(it.packageName) }
                    obj.put("apps", pkgs)
                    foldersArr.put(obj)
                }
                is HomeItem.App -> orderList.add(item.appInfo.packageName)
            }
        }
        prefs.edit().putString("folders_json", foldersArr.toString()).putString("apps_order", orderList.joinToString(",")).apply()
    }

    private fun setupUI() {
        rootLayout = FrameLayout(this).apply {
            setBackgroundColor(Color.TRANSPARENT)
            setOnLongClickListener { if (!isEditMode) enterEditMode(); true }
        }
        mainColumn = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(12), dp(48), dp(12), dp(20))
        }
        widgetsContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
        mainColumn.addView(widgetsContainer, LinearLayout.LayoutParams(-1, -2))
        appsContainer = FrameLayout(this)
        mainColumn.addView(appsContainer, LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = dp(6); bottomMargin = dp(2) })
        pageIndicatorLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
        mainColumn.addView(pageIndicatorLayout, LinearLayout.LayoutParams(-1, dp(20)))
        mainColumn.addView(createSearchBar(), LinearLayout.LayoutParams(-1, dp(46)).apply { topMargin = dp(4); bottomMargin = dp(10); leftMargin = dp(6); rightMargin = dp(6) })
        dockLayout = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER
            background = createLiquidGlassDrawable(30f)
            setPadding(dp(12), dp(12), dp(12), dp(12))
            elevation = 12f
        }
        mainColumn.addView(dockLayout, LinearLayout.LayoutParams(-1, dp(92)))
        rootLayout.addView(mainColumn, FrameLayout.LayoutParams(-1, -1))
        setContentView(rootLayout)
        updateWidgetsUI()
        renderAppsArea()
        renderDock()
    }

    private fun createLiquidGlassDrawable(radiusDp: Float): Drawable {
        val r = dp(radiusDp.toInt()).toFloat()
        val base = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(
            Color.argb(110, 255, 255, 255), Color.argb(55, 255, 255, 255), Color.argb(90, 240, 245, 255)
        )).apply { cornerRadius = r; setStroke(dp(1), Color.argb(180, 255, 255, 255)) }
        val highlight = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(Color.argb(40, 255, 255, 255), Color.TRANSPARENT)).apply { cornerRadius = r }
        return LayerDrawable(arrayOf(base, highlight)).apply { setLayerInset(1, 0, 0, 0, dp(8)) }
    }

    private fun updateWidgetsUI() {
        widgetsContainer.removeAllViews()
        for ((index, type) in activeWidgets.withIndex()) {
            val v = when (type) {
                WidgetType.CLOCK -> buildClockWidget()
                WidgetType.BATTERY -> buildBatteryWidget()
                WidgetType.NOTE -> buildNoteWidget()
            }
            v.setOnLongClickListener { showWidgetMenu(index); true }
            v.alpha = 0f; v.translationY = 20f
            widgetsContainer.addView(v, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(10) })
            v.animate().alpha(1f).translationY(0f).setDuration(280).setInterpolator(DecelerateInterpolator()).start()
        }
    }

    private fun buildClockWidget(): View {
        val box = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            background = createLiquidGlassDrawable(26f)
            setPadding(dp(24), dp(16), dp(24), dp(18))
            elevation = 8f
            setOnClickListener { animatePress(this) { runCatching { startActivity(Intent(AlarmClock.ACTION_SHOW_ALARMS).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) } } }
        }
        val now = Date()
        box.addView(TextView(this).apply {
            text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(now)
            setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 52f)
            typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
            setShadowLayer(10f, 0f, 2f, Color.argb(100, 0, 0, 0))
        })
        box.addView(TextView(this).apply {
            text = SimpleDateFormat("EEEE, d MMMM", Locale("ru")).format(now)
            setTextColor(Color.argb(240, 255, 255, 255)); setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
            setShadowLayer(6f, 0f, 1f, Color.argb(80, 0, 0, 0))
        })
        return box
    }

    private fun buildBatteryWidget(): View {
        val level = (getSystemService(Context.BATTERY_SERVICE) as BatteryManager).getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
        return LinearLayout(this).apply {
            background = createLiquidGlassDrawable(22f)
            setPadding(dp(20), dp(14), dp(20), dp(14)); elevation = 6f
            setOnClickListener { animatePress(this) { runCatching { startActivity(Intent(Intent.ACTION_POWER_USAGE_SUMMARY)) } } }
            addView(TextView(this@MainActivity).apply {
                text = "🔋  Заряд батареи: $level%"
                setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f); typeface = Typeface.DEFAULT_BOLD
            })
        }
    }

    private fun buildNoteWidget(): View {
        val note = prefs.getString("widget_note", "Нажмите для редактирования заметки")
        return LinearLayout(this).apply {
            background = createLiquidGlassDrawable(22f)
            setPadding(dp(20), dp(14), dp(20), dp(14)); elevation = 6f
            setOnClickListener { animatePress(this) { editNoteDialog() } }
            addView(TextView(this@MainActivity).apply {
                text = "📌  $note"; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
            })
        }
    }

    private fun showWidgetMenu(index: Int) {
        val items = arrayOf("➕ Добавить виджет", "⬆️ Выше", "⬇️ Ниже", "🗑️ Удалить")
        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
            .setTitle("Виджет").setItems(items) { _, w ->
                when (w) {
                    0 -> showAddWidgetDialog()
                    1 -> if (index > 0) { Collections.swap(activeWidgets, index, index - 1); saveActiveWidgets(); updateWidgetsUI() }
                    2 -> if (index < activeWidgets.size - 1) { Collections.swap(activeWidgets, index, index + 1); saveActiveWidgets(); updateWidgetsUI() }
                    3 -> { activeWidgets.removeAt(index); saveActiveWidgets(); updateWidgetsUI() }
                }
            }.show()
    }

    private fun showAddWidgetDialog() {
        val names = arrayOf("🕒 Часы", "🔋 Батарея", "📌 Заметка")
        val types = arrayOf(WidgetType.CLOCK, WidgetType.BATTERY, WidgetType.NOTE)
        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
            .setTitle("Добавить виджет").setItems(names) { _, w ->
                if (!activeWidgets.contains(types[w])) {
                    activeWidgets.add(types[w]); saveActiveWidgets(); updateWidgetsUI()
                }
            }.show()
    }

    private fun editNoteDialog() {
        val input = EditText(this).apply { setText(prefs.getString("widget_note", "")); setTextColor(Color.WHITE) }
        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
            .setTitle("Заметка").setView(input)
            .setPositiveButton("Сохранить") { _, _ -> prefs.edit().putString("widget_note", input.text.toString()).apply(); updateWidgetsUI() }
            .setNegativeButton("Отмена", null).show()
    }

    private fun renderAppsArea() {
        appsContainer.removeAllViews()
        pageIndicatorLayout.removeAllViews()
        if (isHorizontalMode) {
            pageIndicatorLayout.visibility = View.VISIBLE
            val totalPages = maxOf(1, ceil(homeItems.size.toDouble() / itemsPerPage).toInt())
            if (currentPage >= totalPages) currentPage = totalPages - 1
            val start = currentPage * itemsPerPage
            val end = min(start + itemsPerPage, homeItems.size)
            val slice = if (start < homeItems.size) homeItems.subList(start, end) else emptyList()
            val swipe = SwipePagerLayout(this).apply {
                onSwipeLeft = { if (currentPage < totalPages - 1) { currentPage++; animatePageChange(true) } }
                onSwipeRight = { if (currentPage > 0) { currentPage--; animatePageChange(false) } }
            }
            swipe.addView(buildGridForItems(slice, start), FrameLayout.LayoutParams(-1, -1))
            appsContainer.addView(swipe)
            for (i in 0 until totalPages) {
                val active = i == currentPage
                val dot = View(this).apply {
                    val sz = if (active) dp(8) else dp(6)
                    layoutParams = LinearLayout.LayoutParams(sz, sz).apply { leftMargin = dp(4); rightMargin = dp(4) }
                    background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(if (active) Color.WHITE else Color.argb(100, 255, 255, 255)) }
                    if (active) { scaleX = 0.6f; scaleY = 0.6f; animate().scaleX(1f).scaleY(1f).setDuration(200).setInterpolator(OvershootInterpolator()).start() }
                }
                pageIndicatorLayout.addView(dot)
            }
        } else {
            pageIndicatorLayout.visibility = View.GONE
            val scroll = ScrollView(this).apply { isVerticalScrollBarEnabled = false }
            scroll.addView(buildGridForItems(homeItems, 0))
            appsContainer.addView(scroll, FrameLayout.LayoutParams(-1, -1))
        }
    }

    private fun animatePageChange(toLeft: Boolean) {
        val cur = appsContainer.getChildAt(0)
        cur?.animate()?.translationX(if (toLeft) -dp(80).toFloat() else dp(80).toFloat())?.alpha(0.3f)?.setDuration(160)?.withEndAction {
            renderAppsArea()
            val nv = appsContainer.getChildAt(0)
            nv?.translationX = if (toLeft) dp(80).toFloat() else -dp(80).toFloat()
            nv?.alpha = 0.3f
            nv?.animate()?.translationX(0f)?.alpha(1f)?.setDuration(200)?.setInterpolator(DecelerateInterpolator())?.start()
        }?.start()
    }

    private fun buildGridForItems(items: List<HomeItem>, offset: Int): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            val rows = ceil(items.size.toDouble() / columns).toInt()
            for (r in 0 until rows) {
                val row = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL; weightSum = columns.toFloat() }
                for (c in 0 until columns) {
                    val idx = r * columns + c
                    if (idx < items.size) {
                        row.addView(createHomeItemView(items[idx], offset + idx), LinearLayout.LayoutParams(0, -2, 1f).apply { topMargin = dp(6); bottomMargin = dp(6) })
                    } else row.addView(Space(this@MainActivity), LinearLayout.LayoutParams(0, dp(10), 1f))
                }
                addView(row)
            }
        }
    }

    private fun createHomeItemView(item: HomeItem, globalIdx: Int): View {
        val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL; setPadding(dp(4), dp(4), dp(4), dp(4)) }
        when (item) {
            is HomeItem.App -> {
                val iv = ImageView(this).apply { setImageDrawable(item.appInfo.icon); scaleType = ImageView.ScaleType.FIT_CENTER; elevation = 4f }
                val tv = TextView(this).apply {
                    text = item.appInfo.label; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                    maxLines = 1; ellipsize = TextUtils.TruncateAt.END; gravity = Gravity.CENTER; setShadowLayer(6f, 0f, 1.5f, Color.BLACK)
                }
                box.addView(iv, LinearLayout.LayoutParams(dp(58), dp(58)))
                box.addView(tv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(5) })
                box.setOnClickListener { if (isEditMode) showAppPopup(box, item.appInfo, globalIdx) else animatePress(box) { launchApp(item.appInfo.packageName) } }
                box.setOnLongClickListener { performHaptic(40); if (!isEditMode) enterEditMode(); showAppPopup(box, item.appInfo, globalIdx); true }
                if (isEditMode) startJiggle(box)
            }
            is HomeItem.Folder -> {
                val grid = GridLayout(this).apply {
                    rowCount = 2; columnCount = 2; background = createLiquidGlassDrawable(16f); setPadding(dp(7), dp(7), dp(7), dp(7)); elevation = 4f
                }
                item.apps.take(4).forEach { app ->
                    grid.addView(ImageView(this).apply {
                        setImageDrawable(app.icon)
                        layoutParams = GridLayout.LayoutParams().apply { width = dp(20); height = dp(20); setMargins(dp(2), dp(2), dp(2), dp(2)) }
                    })
                }
                val tv = TextView(this).apply {
                    text = item.name; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                    maxLines = 1; ellipsize = TextUtils.TruncateAt.END; gravity = Gravity.CENTER; setShadowLayer(6f, 0f, 1.5f, Color.BLACK)
                }
                box.addView(grid, LinearLayout.LayoutParams(dp(58), dp(58)))
                box.addView(tv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(5) })
                box.setOnClickListener { if (isEditMode) showFolderMenu(item, globalIdx) else animatePress(box) { openFolderDialog(item) } }
                box.setOnLongClickListener { performHaptic(40); if (!isEditMode) enterEditMode(); showFolderMenu(item, globalIdx); true }
                if (isEditMode) startJiggle(box)
            }
        }
        return box
    }

    private fun animatePress(view: View, action: () -> Unit) {
        view.animate().scaleX(0.86f).scaleY(0.86f).setDuration(90).setInterpolator(DecelerateInterpolator())
            .withEndAction { view.animate().scaleX(1f).scaleY(1f).setDuration(160).setInterpolator(OvershootInterpolator(2.5f)).withEndAction { action() }.start() }.start()
        performHaptic(15)
    }

    private fun enterEditMode() {
        if (isEditMode) return
        isEditMode = true
        performHaptic(50)
        Toast.makeText(this, "Режим редактирования (Back = выход)", Toast.LENGTH_SHORT).show()
        renderAppsArea(); renderDock()
    }

    private fun exitEditMode() {
        if (!isEditMode) return
        isEditMode = false
        renderAppsArea(); renderDock()
    }

    private fun startJiggle(view: View) {
        ObjectAnimator.ofFloat(view, "rotation", -2.2f, 2.2f).apply {
            duration = 140; repeatCount = ValueAnimator.INFINITE; repeatMode = ValueAnimator.REVERSE; interpolator = DecelerateInterpolator()
        }.start()
    }

    private fun showAppPopup(anchor: View, app: AppInfo, index: Int) {
        val layout = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            background = GradientDrawable().apply { cornerRadius = dp(18).toFloat(); setColor(Color.argb(240, 30, 30, 35)); setStroke(dp(1), Color.argb(120, 255, 255, 255)) }
            setPadding(dp(6), dp(6), dp(6), dp(6)); elevation = 28f
        }
        lateinit var popup: PopupWindow
        fun row(text: String, color: Int = Color.WHITE, action: () -> Unit) {
            layout.addView(TextView(this).apply {
                this.text = text; setTextColor(color); setTextSize(TypedValue.COMPLEX_UNIT_SP, 14.5f)
                setPadding(dp(18), dp(13), dp(18), dp(13)); setOnClickListener { popup.dismiss(); action() }
            })
        }
        row("ℹ️  О приложении") { openAppSettings(app.packageName) }
        row("🗑️  Удалить", Color.rgb(255, 90, 85)) { uninstallApp(app.packageName) }
        row("📁  В папку") { moveToFolderDialog(app, index) }
        row("⬅️  Влево") { if (index > 0) { Collections.swap(homeItems, index, index - 1); saveHomeState(); renderAppsArea() } }
        row("➡️  Вправо") { if (index < homeItems.size - 1) { Collections.swap(homeItems, index, index + 1); saveHomeState(); renderAppsArea() } }
        if (isEditMode) row("✅  Готово") { exitEditMode() }
        popup = PopupWindow(layout, dp(250), -2, true).apply {
            elevation = 30f; setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT)); showAsDropDown(anchor, 0, -dp(16))
        }
    }

    private fun moveToFolderDialog(app: AppInfo, index: Int) {
        val folders = homeItems.filterIsInstance<HomeItem.Folder>()
        val opts = mutableListOf("➕ Новая папка")
        folders.forEach { opts.add("📁 ${it.name}") }
        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
            .setTitle(app.label).setItems(opts.toTypedArray()) { _, w ->
                if (w == 0) {
                    val input = EditText(this).apply { setText("Новая папка"); setTextColor(Color.WHITE) }
                    AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                        .setTitle("Название").setView(input)
                        .setPositiveButton("Создать") { _, _ ->
                            homeItems[index] = HomeItem.Folder(input.text.toString().ifBlank { "Папка" }, mutableListOf(app))
                            saveHomeState(); renderAppsArea()
                        }.setNegativeButton("Отмена", null).show()
                } else {
                    folders[w - 1].apps.add(app); homeItems.removeAt(index); saveHomeState(); renderAppsArea()
                }
            }.show()
    }

    private fun openFolderDialog(folder: HomeItem.Folder) {
        val box = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL; setPadding(dp(22), dp(22), dp(22), dp(22))
            background = createLiquidGlassDrawable(28f); elevation = 20f; scaleX = 0.85f; scaleY = 0.85f; alpha = 0f
        }
        box.addView(TextView(this).apply {
            text = folder.name; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
            typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER; setPadding(0, 0, 0, dp(14))
        })
        val grid = GridLayout(this).apply { columnCount = 3 }
        lateinit var dialog: AlertDialog
        folder.apps.toList().forEachIndexed { idx, app ->
            val cell = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(dp(10), dp(10), dp(10), dp(10))
                setOnClickListener { dialog.dismiss(); animatePress(this) { launchApp(app.packageName) } }
                setOnLongClickListener {
                    dialog.dismiss(); folder.apps.removeAt(idx); homeItems.add(HomeItem.App(app))
                    if (folder.apps.isEmpty()) homeItems.remove(folder)
                    saveHomeState(); renderAppsArea()
                    Toast.makeText(this@MainActivity, "Вынесено", Toast.LENGTH_SHORT).show(); true
                }
            }
            cell.addView(ImageView(this).apply { setImageDrawable(app.icon); layoutParams = LinearLayout.LayoutParams(dp(52), dp(52)) })
            cell.addView(TextView(this).apply { text = app.label; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f); maxLines = 1 })
            grid.addView(cell)
        }
        box.addView(grid)
        dialog = AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setView(box).setPositiveButton("Закрыть", null).create()
        dialog.window?.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
        dialog.show()
        box.animate().scaleX(1f).scaleY(1f).alpha(1f).setDuration(280).setInterpolator(OvershootInterpolator(1.4f)).start()
    }

    private fun showFolderMenu(folder: HomeItem.Folder, index: Int) {
        val opts = arrayOf("✏️ Переименовать", "📂 Расформировать", if (isEditMode) "✅ Готово" else "🔄 Редактирование")
        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
            .setTitle(folder.name).setItems(opts) { _, w ->
                when (w) {
                    0 -> {
                        val input = EditText(this).apply { setText(folder.name); setTextColor(Color.WHITE) }
                        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                            .setTitle("Переименовать").setView(input)
                            .setPositiveButton("ОК") { _, _ -> folder.name = input.text.toString().ifBlank { "Папка" }; saveHomeState(); renderAppsArea() }.show()
                    }
                    1 -> { homeItems.removeAt(index); folder.apps.forEach { homeItems.add(HomeItem.App(it)) }; saveHomeState(); renderAppsArea() }
                    2 -> if (isEditMode) exitEditMode() else enterEditMode()
                }
            }.show()
    }

    private fun createSearchBar(): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
            background = createLiquidGlassDrawable(23f); setPadding(dp(18), dp(8), dp(14), dp(8)); elevation = 6f
            addView(TextView(this@MainActivity).apply {
                text = "🔍  Поиск"; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 15.5f)
                layoutParams = LinearLayout.LayoutParams(0, -2, 1f); setOnClickListener { showSearchDialog() }
            })
            addView(TextView(this@MainActivity).apply {
                text = "⚙️"; setTextSize(TypedValue.COMPLEX_UNIT_SP, 19f); setPadding(dp(10), dp(2), dp(4), dp(2))
                setOnClickListener { showLauncherSettingsDialog() }
            })
        }
    }

    private fun showSearchDialog() {
        val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(16), dp(16), dp(16)) }
        val input = EditText(this).apply { hint = "Поиск..."; setHintTextColor(Color.GRAY); setTextColor(Color.WHITE) }
        val lv = ListView(this)
        box.addView(input); box.addView(lv)
        val dlg = AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setTitle("Поиск").setView(box).setNegativeButton("Закрыть", null).create()
        fun filter(q: String) {
            val list = allApps.filter { it.label.contains(q, true) }
            lv.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, list.map { it.label })
            lv.setOnItemClickListener { _, _, pos, _ -> dlg.dismiss(); launchApp(list[pos].packageName) }
        }
        input.addTextChangedListener(object : TextWatcher {
            override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
            override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) { filter(s?.toString() ?: "") }
            override fun afterTextChanged(s: Editable?) {}
        })
        filter(""); dlg.show()
    }

    private fun showLauncherSettingsDialog() {
        val mode = if (isHorizontalMode) "Страницы (iOS)" else "Вертикально"
        val opts = arrayOf("🔄 Прокрутка: $mode", "➕ Виджет", "✨ Редактирование", "♻️ Сброс")
        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
            .setTitle("Настройки").setItems(opts) { _, w ->
                when (w) {
                    0 -> { isHorizontalMode = !isHorizontalMode; prefs.edit().putBoolean("horizontal_mode", isHorizontalMode).apply(); currentPage = 0; renderAppsArea() }
                    1 -> showAddWidgetDialog()
                    2 -> if (isEditMode) exitEditMode() else enterEditMode()
                    3 -> { prefs.edit().remove("folders_json").remove("apps_order").apply(); buildHomeItemsFromState(); renderAppsArea() }
                }
            }.show()
    }

    private fun renderDock() {
        dockLayout.removeAllViews()
        allApps.take(4).forEach { app ->
            val iv = ImageView(this).apply {
                setImageDrawable(app.icon); layoutParams = LinearLayout.LayoutParams(0, dp(62), 1f)
                scaleType = ImageView.ScaleType.FIT_CENTER; elevation = 6f
                setOnClickListener { if (!isEditMode) animatePress(this) { launchApp(app.packageName) } }
                setOnLongClickListener { performHaptic(35); showAppPopup(this, app, 0); true }
            }
            if (isEditMode) startJiggle(iv)
            dockLayout.addView(iv)
        }
    }

    private fun launchApp(pkg: String) {
        try { packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) } ?: Toast.makeText(this, "Не удалось", Toast.LENGTH_SHORT).show() }
        catch (_: Exception) { Toast.makeText(this, "Ошибка", Toast.LENGTH_SHORT).show() }
    }

    private fun uninstallApp(pkg: String) {
        try { startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:$pkg")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) }
        catch (_: Exception) { Toast.makeText(this, "Не удалось", Toast.LENGTH_SHORT).show() }
    }

    private fun openAppSettings(pkg: String) {
        try { startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) }
        catch (_: Exception) {}
    }

    private fun dp(v: Int) = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
}
